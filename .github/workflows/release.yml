name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version du tag (ex: v1.0.0, laisser vide pour le tag courant/commit)"
        required: false
        default: ""
      publish_release:
        description: "Publier la release GitHub ?"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 20

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      ASYNC_BUILTIN_TEAM_SOURCE: ${{ github.workspace }}/agency-agents
      GYP_MSVS_VERSION: "2022"
      npm_config_msvs_version: "2022"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out builtin team repository
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: msitarzewski/agency-agents
          path: agency-agents
          fetch-depth: 1

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Configure node-gyp
        shell: bash
        run: |
          npm config set msvs_version 2022
          npm config set python python

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installers
        run: npm run release:win

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release/*.exe
            release/*.msi
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  macos-release:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ASYNC_BUILTIN_TEAM_SOURCE: ${{ github.workspace }}/agency-agents

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out builtin team repository
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: msitarzewski/agency-agents
          path: agency-agents
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build macOS packages (unsigned)
        run: npm run release:mac:unsigned

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - windows-release
      - macos-release
    # Condition : publier uniquement si push sur main, ou si workflow_dispatch avec publish_release = true
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)

    steps:
      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-assets/windows

      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: release-assets/macos

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_tag != '' && inputs.version_tag || github.ref_name }}
          files: |
            release-assets/windows/**/*
            release-assets/macos/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true